<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ukuraoke</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎶</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="/" class="logo">Ukuraoke</a>
    <form id="search">
      <input name="q" placeholder="Song">
      <input name="artist" placeholder="Artist">
      <button>Search</button>
    </form>
  </header>
  <main>
    <section id="home" hidden>
      <div class="hero">
        <h1>Strum along. Sing along.</h1>
        <p>Ukulele chords with a diagram over every chord, and lyrics that follow the music.</p>
        <div class="chips">
          <a class="chip" href="?artist=Vance+Joy">Vance Joy</a>
          <a class="chip" href="?artist=Ed+Sheeran">Ed Sheeran</a>
          <a class="chip" href="?artist=Taylor+Swift">Taylor Swift</a>
          <a class="chip" href="?artist=Jason+Mraz">Jason Mraz</a>
          <a class="chip" href="?artist=Bruno+Mars">Bruno Mars</a>
          <a class="chip" href="?artist=The+Beatles">The Beatles</a>
          <a class="chip" href="?artist=Billie+Eilish">Billie Eilish</a>
          <a class="chip" href="?artist=Elvis+Presley">Elvis Presley</a>
        </div>
      </div>
      <div id="shelves"></div>
    </section>
    <section id="results"></section>
    <section id="song" hidden>
      <h1 id="title"></h1>
      <a id="by"></a>
      <p id="meta"></p>
      <div class="bar">
        <button data-source="youtube" class="on">YouTube</button>
        <button data-source="file">My file</button>
        <span class="grow"></span>
        <button id="down">♭</button><span id="key">0</span><button id="up">♯</button>
        <button id="earlier">−0.5s</button><span id="offset">0.0s</span><button id="later">+0.5s</button>
        <button id="diagrams">Diagrams</button>
        <button id="autoscroll">Autoscroll</button>
        <button id="view">Sheet</button>
      </div>
      <div id="youtube-source">
        <select id="videos"></select>
        <input id="yt-link" placeholder="Or paste a YouTube link">
        <div id="yt"></div>
      </div>
      <div id="file-source" hidden>
        <input type="file" id="file" accept="audio/*,video/*">
        <audio id="audio" controls></audio>
      </div>
      <div class="song-body">
        <aside id="chordbar">
          <button id="chordbar-toggle"></button>
          <div id="chordlist"></div>
        </aside>
        <div>
          <div id="lines"></div>
          <div id="sheet" hidden></div>
        </div>
      </div>
    </section>
  </main>
  <div id="playbar" hidden>
    <button id="back" title="Back 5 seconds">−5</button>
    <button id="play" title="Play or pause (space)">▶</button>
    <button id="fwd" title="Forward 5 seconds">+5</button>
    <span id="now">0:00</span>
    <input type="range" id="seek" min="0" max="1" step="0.1" value="0">
    <span id="total">0:00</span>
    <span id="np"></span>
  </div>
  <script src="uke.js"></script>
  <script src="app.js"></script>
</body>
</html>
